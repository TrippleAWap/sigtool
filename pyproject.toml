# sigtool is the Rust crate under native/. The Python left in the repo is
# tooling (corpus builders, the golden-vector generator) and the IDA plugin,
# which shells out to sigtool-native; this file only configures their linter.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
