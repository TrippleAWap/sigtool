name: release

# A pushed version tag builds every platform and publishes the GitHub Release
# for it. A manual run builds and packages the same artifacts (downloadable from
# the run) without publishing anything.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux pinned like ci.yml; the binary needs glibc 2.39 or newer.
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: sigtool-native
          # arm64 is cross-compiled: GitHub's arm64 runners are free only for
          # public repositories. Capstone builds its bundled C sources, so the
          # cross gcc is both the linker and CC.
          - platform: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            exe: sigtool-native
            cross: true
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: sigtool-native.exe
          # Cross-compiled with the MSVC ARM64 tools installed on the image;
          # cc finds them through vswhere.
          - platform: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: sigtool-native.exe
            cross: true
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: sigtool-native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: native
        run: cargo build --release --locked --target ${{ matrix.target }} --bin sigtool-native

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: native/target/${{ matrix.target }}/release/${{ matrix.exe }} --help

      - name: Package
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args=(--expect-version "${GITHUB_REF_NAME#v}")
          fi
          python packaging/package.py --platform ${{ matrix.platform }} \
            --binary native/target/${{ matrix.target }}/release/${{ matrix.exe }} \
            --out dist "${args[@]}"

      - name: Lint the plugin archive
        if: matrix.platform == 'linux-x86_64'
        run: |
          python -m pip install "ida-hcli==${HCLI_VERSION}"
          for archive in dist/sigtool-ida-plugin-*.zip; do hcli plugin lint "$archive"; done
        env:
          HCLI_VERSION: "0.27.3"

      - uses: actions/upload-artifact@v4
        with:
          name: sigtool-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sigtool-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "sigtool $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
