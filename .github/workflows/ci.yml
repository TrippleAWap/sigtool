name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toy-corpus baseline is measured on this exact release: patch releases
  # change codegen enough to move a one-function cell by more than the bench
  # tolerance (22.1.8 lost one function in several 16-function cells).
  LLVM_VERSION: "22.1.5"
  LLVM_SHA256: "04dfa3ab6f1c332dd73a057daeb8f48cdaacdef24178f8eccddf2cbfa8944aa4"

jobs:
  linux:
    name: linux (fmt, clippy, tests, corpus gate)
    # Pinned: the LLVM release binaries link libxml2.so.2, which Ubuntu 26.04
    # (the new ubuntu-latest) no longer ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM runtime libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxml2

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64-corpus-tools-lld-link

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          archive="LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$archive"
          echo "$LLVM_SHA256  $archive" | sha256sum -c -
          mkdir -p ~/llvm
          # Only the tools the corpus build and tests use, plus clang's
          # resource headers and any shared libraries they link against.
          tar -xJf "$archive" -C ~/llvm --strip-components=1 --wildcards \
            "*/bin/clang" "*/bin/clang-[0-9]*" "*/bin/lld" "*/bin/ld.lld" "*/bin/lld-link" \
            "*/bin/llvm-readobj" "*/bin/llvm-readelf" "*/bin/llvm-nm" \
            "*/bin/llvm-objcopy" "*/bin/llvm-strip" "*/lib/clang/*" "*/lib/lib*.so*" \
            || test -x ~/llvm/bin/clang
          rm "$archive"

      - name: Use LLVM ${{ env.LLVM_VERSION }}
        run: |
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          ~/llvm/bin/clang --version | head -1
          ~/llvm/bin/ld.lld --version

      - name: Lint build scripts and the IDA plugin
        run: |
          python -m pip install ruff
          python -m ruff format --check corpus packaging tests/vectors tests/test_ida_plugin.py tests/ida_cli_smoke.py ida_plugin.py
          python -m ruff check corpus packaging tests/vectors tests/test_ida_plugin.py tests/ida_cli_smoke.py ida_plugin.py

      - name: Test the IDA plugin's IDA-free parts
        run: python -m unittest tests/test_ida_plugin.py

      - name: Build corpus
        run: python corpus/build.py

      - name: Format
        working-directory: native
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: native
        # LLVM is installed here, so a test that skips for a missing tool
        # fails instead of passing without having run.
        env:
          SIGTOOL_REQUIRE_TOOLS: "1"
        run: cargo test --release

      - name: Corpus bench
        working-directory: native
        run: cargo run --release -- bench --baseline ../tests/baseline/native-bench.json

  windows:
    name: windows (tests, live process)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests (includes live PID mode)
        working-directory: native
        run: cargo test --release

  fuzz:
    name: fuzz (cargo-fuzz, 60 s per target)
    # Independent of the corpus build: seeds come from tests/hostile_inputs.rs
    # (images built in the test, a signature, a database) and the committed
    # golden vectors' code sections.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Seed corpora
        working-directory: native
        env:
          SIGTOOL_FUZZ_SEEDS: ${{ github.workspace }}/native/fuzz/corpus
        run: cargo test --release --test hostile_inputs write_fuzz_seeds

      - name: Build fuzz targets
        working-directory: native
        # cargo-fuzz's default build keeps debug assertions and overflow
        # checks on, so arithmetic overflow on hostile input is a crash.
        run: cargo fuzz build

      - name: Fuzz
        working-directory: native
        # Every target runs even after one fails; -timeout turns a hang on one
        # input into a reported crash (AGENTS.md rule 8).
        run: |
          status=0
          for target in image signature db code; do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60 -timeout=10 || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: native/fuzz/artifacts/
          if-no-files-found: ignore
