name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toy-corpus baseline is measured on this compiler; other versions move
  # small cells by more than the bench tolerance.
  LLVM_VERSION: "22"

jobs:
  linux:
    name: linux (fmt, clippy, tests, corpus gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Lint build scripts and the IDA plugin
        run: |
          python -m pip install ruff
          python -m ruff format --check corpus tests/vectors ida_plugin.py
          python -m ruff check corpus tests/vectors ida_plugin.py

      - name: Build corpus
        run: python corpus/build.py

      - name: Format
        working-directory: native
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: native
        run: cargo test --release

      - name: Corpus bench
        working-directory: native
        run: cargo run --release -- bench --baseline ../tests/baseline/native-bench.json

  windows:
    name: windows (tests, live process)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests (includes live PID mode)
        working-directory: native
        run: cargo test --release
