name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (lint, types, corpus, bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy core sources

      - name: Build corpus
        run: python corpus/build.py

      - name: Tests
        run: python -m pytest

      - name: Corpus regression
        run: python bench.py --baseline tests/baseline/bench.json --json corpus/report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: corpus/report.json
          if-no-files-found: warn

  windows:
    name: windows (live process)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy core sources

      - name: Tests (includes live PID mode)
        run: python -m pytest

  native:
    name: native (rust, x64 parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld

      - name: Build corpus
        run: python corpus/build.py

      - name: Format
        working-directory: native
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: native
        run: cargo test
