[package]
name = "sigtool-native"
version = "0.1.0"
edition = "2021"
description = "Native scanner for the sigtool feature signature spec"
license = "MIT OR Apache-2.0"

[lib]
name = "sigtool_native"
path = "src/lib.rs"

[[bin]]
name = "sigtool-native"
path = "src/main.rs"

[dependencies]
blake2b_simd = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
